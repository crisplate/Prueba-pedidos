<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Master — Dale pué</title>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

    :root {
      --bg: #f5f4f0;
      --white: #ffffff;
      --border: #e2e0d8;
      --text: #1a1a18;
      --muted: #7a7870;
      --accent: #d9232d;
      --dark: #111111;
      --green: #1a9e5a;
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Pantalla de Login Master */
    #login-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-box {
      background: var(--white);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-box h1 { margin-bottom: 0.5rem; color: var(--accent); }
    .login-box p { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
    
    input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
    }
    
    button {
      width: 100%;
      padding: 0.8rem;
      background: var(--accent);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }

    /* Panel Master (Oculto por defecto) */
    #admin-view { display: none; padding: 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border);
    }
    .btn-logout { background: var(--dark); width: auto; padding: 0.6rem 1.2rem; }

    /* Tabla de Locales */
    .table-container {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 1rem; border-bottom: 1px solid var(--border); }
    th { background: #faf9f6; color: var(--muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
    
    .status-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-block;
    }
    .status-abierto { background: #e6f4ea; color: var(--green); }
    .status-cerrado { background: #fce8e6; color: var(--accent); }

    .acciones { display: flex; gap: 0.5rem; }
    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; width: auto; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-danger { background: var(--accent); }

    /* Toast */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--dark); color: var(--white); padding: 12px 24px; border-radius: 8px;
      font-weight: 500; transition: all 0.3s ease; opacity: 0; z-index: 9999;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div id="toast">Notificación</div>

  <div id="login-view">
    <div class="login-box">
      <h1>Master Panel</h1>
      <p>Acceso exclusivo de administrador</p>
      <input type="email" id="email" placeholder="Correo electrónico" value="cristian_arispe93@hotmail.com" readonly style="background:#f5f4f0; color:#888;">
      <input type="password" id="pass" placeholder="Tu contraseña de administrador">
      <button onclick="loginMaster()">Ingresar al Panel</button>
    </div>
  </div>

  <div id="admin-view">
    <header>
      <div>
        <h2>Panel de Control Global</h2>
        <p style="color: var(--muted); font-size: 0.9rem; margin-top:4px;">Gestión de locales de Dale pué</p>
      </div>
      <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
    </header>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nombre del Local</th>
            <th>Email Dueño</th>
            <th>Estado</th>
            <th>Teléfono / WhatsApp</th>
            <th>Acciones Rápidas</th>
          </tr>
        </thead>
        <tbody id="tabla-locales">
          <tr><td colspan="5" style="text-align:center; padding: 2rem;">Cargando locales...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // =========================================================
    // 1. CONFIGURACIÓN DE FIREBASE (PEGÁ TUS CREDENCIALES ACÁ)
    // =========================================================
    const firebaseConfig = {
  apiKey: "AIzaSyCwfVFtJxYIa6I1R624IRmF0SoE1o1-RPE",
  authDomain: "dale-pue.firebaseapp.com",
  projectId: "dale-pue",
  storageBucket: "dale-pue.firebasestorage.app",
  messagingSenderId: "137759081638",
  appId: "1:137759081638:web:0816dd9327837d4dc46067"
};

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const MASTER_EMAIL = "cristian_arispe93@hotmail.com";

    // =========================================================
    // 2. SISTEMA DE AUTENTICACIÓN
    // =========================================================
    auth.onAuthStateChanged(user => {
      if (user) {
        if (user.email === MASTER_EMAIL) {
          document.getElementById('login-view').style.display = 'none';
          document.getElementById('admin-view').style.display = 'block';
          cargarLocales();
        } else {
          toast("Acceso denegado. No sos el administrador.");
          auth.signOut();
        }
      } else {
        document.getElementById('login-view').style.display = 'flex';
        document.getElementById('admin-view').style.display = 'none';
      }
    });

    async function loginMaster() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      if(!pass) return toast("Ingresá tu contraseña");
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (error) {
        toast("Error de acceso: Contraseña incorrecta");
      }
    }

    function logout() {
      auth.signOut();
    }

    // =========================================================
    // 3. LÓGICA DEL PANEL DE CONTROL
    // =========================================================
    async function cargarLocales() {
      const tbody = document.getElementById('tabla-locales');
      
      // Escuchador en tiempo real de todos los locales
      db.collection('locales').onSnapshot(snapshot => {
        tbody.innerHTML = '';
        if(snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No hay locales registrados aún.</td></tr>';
          return;
        }

        snapshot.forEach(doc => {
          const d = doc.data();
          const tr = document.createElement('tr');
          
          const estadoClase = d.estado === 'abierto' ? 'status-abierto' : 'status-cerrado';
          const estadoTexto = d.estado === 'abierto' ? '🟢 ABIERTO' : '🔴 CERRADO';

          tr.innerHTML = `
            <td style="font-weight:600;">${d.nombre || 'Sin configurar'}</td>
            <td style="color:var(--muted); font-size:0.9rem;">${d.dueno_email || '—'}</td>
            <td><span class="status-badge ${estadoClase}">${estadoTexto}</span></td>
            <td style="font-size:0.9rem;">${d.whatsapp || 'No registrado'}</td>
            <td class="acciones">
              <button class="btn-sm btn-outline" onclick="toggleEstado('${doc.id}', '${d.estado}')">
                ${d.estado === 'abierto' ? 'Cerrar' : 'Abrir'}
              </button>
              <button class="btn-sm btn-danger" onclick="eliminarLocal('${doc.id}', '${d.nombre}')">Eliminar</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }, error => {
        console.error("Error cargando locales:", error);
        toast("Error al cargar la base de datos.");
      });
    }

    // Cambiar estado abierto/cerrado con poder de Admin
    async function toggleEstado(id, estadoActual) {
      const nuevoEstado = estadoActual === 'abierto' ? 'cerrado' : 'abierto';
      try {
        await db.collection('locales').doc(id).update({ estado: nuevoEstado });
        toast(`Local cambiado a ${nuevoEstado.toUpperCase()}`);
      } catch (e) {
        toast("Error al actualizar estado");
        console.error(e);
      }
    }

    // Eliminar local por completo
    async function eliminarLocal(id, nombre) {
      if(!confirm(`⚠️ ATENCIÓN: ¿Estás seguro de eliminar por completo el local "${nombre}"? Esta acción no se puede deshacer.`)) return;
      try {
        await db.collection('locales').doc(id).delete();
        toast("Local eliminado con éxito");
      } catch (e) {
        toast("Error al eliminar local");
        console.error(e);
      }
    }

    // =========================================================
    // 4. UTILIDADES (Toasts)
    // =========================================================
    let toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
